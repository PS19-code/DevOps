name: Hello Spring Boot App to AWS EKS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "springboot/hello-spring/**"

jobs:
    build-test:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup JDK
            uses: actions/setup-java@v5
            with:
                distribution: 'temurin' # See 'Supported distributions' for available options
                java-version: '21'

          - name: Build and Test (Maven)
            working-directory: springboot/hello-spring
            run: mvn -B clean verify

          - name: Upload Test Reports
            uses: actions/upload-artifact@v4
            with:
                name: test-reports
                path: springboot/hello-spring/target/surefire-reports

    docker-build-push:
        runs-on: ubuntu-latest
        needs: build-test

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup JDK
            uses: actions/setup-java@v5
            with:
                distribution: 'temurin' # See 'Supported distributions' for available options
                java-version: '21'

          - name: Build JAR for Docker
            working-directory: springboot/hello-spring
            run: mvn -B clean package -DskipTests

          - name: Login to DockerHub
            uses: docker/login-action@v3
            with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}   
            
          - name: Build and Push Docker Image
            uses: docker/build-push-action@v6
            with:
                context: springboot/hello-spring
                push: true
                tags: |
                    ${{ secrets.DOCKER_USERNAME }}/hello-spring:latest   
                    ${{ secrets.DOCKER_USERNAME }}/hello-spring:${{ github.sha }}    
                    ${{ secrets.DOCKER_USERNAME }}/hello-spring:${{ github.ref_name }}            
    deploy-docker-ec2:
        runs-on: ubuntu-latest
        needs: docker-build-push

        steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Configure SSH
            run: |
                    mkdir -p ~/.ssh
                    echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
                    chmod 600 ~/.ssh/ec2.pem

          - name: Deploy to EC2
            run: |
                ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no ubuntu@98.93.231.145 "
                docker pull codewithps/hello-spring:latest &&
                docker stop hello-spring || true &&
                docker rm hello-spring || true &&
                docker run -d --name hello-spring -p 8080:8080 codewithps/hello-spring:latest
                "